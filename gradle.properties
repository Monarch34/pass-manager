# Kotlin/Native's compiler runs in this daemon and Argon2-scale test work is memory hungry.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# Not on by default until Gradle 10. `problems=warn` while the build is still being
# assembled: a configuration-cache problem should be visible without blocking work, and
# this flips to `fail` once the whole build is green with it on. Some Kotlin/Native
# simulator-test tasks have historically failed to serialize, which is the part to watch.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true

kotlin.code.style=official

# Apple targets cannot be linked or tested from a Windows or Linux host, and the Kotlin
# plugin already skips those tasks by itself. This only silences the per-task warning so
# a build log on the development machine stays readable; it changes nothing about what
# runs. Apple work is verified on macOS CI.
kotlin.native.ignoreDisabledTargets=true
