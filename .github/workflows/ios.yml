name: iOS

on:
  push:
    # `ios-ui` is a second working branch so the design pass and the signing/
    # Keychain work can each get their own CI feedback loop without queueing
    # behind one another. `concurrency` is keyed on the ref, so the two never
    # cancel each other's runs.
    branches: [ios-app, ios-ui]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-15 is the last runner image carrying Xcode 16.x (16.0-16.4, default 16.4).
  # macos-14 retires 2026-11-02, with brownouts from 2026-10-05; macos-latest is now
  # macOS 26, which ships only Xcode 26.x.
  XCODE_APP: "/Applications/Xcode_16.4.app"

  # Pinned rather than `brew install xcodegen`: XcodeGen 2.45.x started writing
  # pbxproj objectVersion 77, which the runner image's Xcode cannot open, and the
  # failure arrives as an unrelated-looking parse error. Pinning makes the generated
  # project format a decision instead of whatever Homebrew resolved that morning.
  XCODEGEN_VERSION: "2.44.1"

jobs:
  core-test:
    name: Core package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Check for core package
        id: probe
        run: |
          if [ -f ios/PassVaultCore/Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/PassVaultCore not present yet — skipping."
          fi
      - name: Build and test PassVaultCore
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassVaultCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee core-test.log
      - name: Upload core test log
        if: always() && steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: core-test-log
          path: ios/PassVaultCore/core-test.log

  app-build:
    name: App build (simulator, ad-hoc signed)
    runs-on: macos-15
    needs: core-test
    steps:
      - uses: actions/checkout@v7
      - name: Check for app project
        id: probe
        run: |
          if [ -f ios/PassManager/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/PassManager/project.yml not present yet — skipping."
          fi
      # Pinned, not "newest on the runner". That heuristic was right on macos-14, whose
      # newest Xcode was 16.2; macos-15 also ships Xcode 26.3, so the same line would jump
      # two major versions without a word. macos-15 is the last image carrying any 16.x at
      # all, so this pin has a shelf life -- moving to Xcode 26 is a deliberate change with
      # its own build to prove it, not something a runner upgrade gets to decide.
      - name: Select the pinned Xcode
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install pinned XcodeGen
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          BIN=$(find /tmp/xcodegen -type f -name xcodegen -perm +111 | head -1)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version
      - name: Generate Xcode project
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        run: xcodegen generate
      # No device is named anywhere: selecting the newest Xcode also swaps the simulator
      # set it ships with, so a literal "iPhone 15" silently stops resolving and the
      # failure reads like a project error. Building needs no device at all; the test run
      # takes whatever iPhone the image actually has and addresses it by UDID.
      - name: Resolve a simulator for testing
        if: steps.probe.outputs.present == 'true'
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x.get('isAvailable') and 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # LOAD-BEARING ABSENCE: do NOT add `CODE_SIGNING_ALLOWED=NO` back to either
      # xcodebuild line. `project.yml` ad-hoc signs the app so it carries an
      # `application-identifier` entitlement, which is the only reason the
      # simulator's Keychain accepts `SecItemAdd` at all. A command-line override
      # beats the project setting, silently un-signs the build, and the failure
      # surfaces far downstream: vault creation fails and the screenshot tour
      # stops on its first screen. This has already been re-introduced once by a
      # careless file-level revert of this workflow.
      - name: Build for simulator
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        run: |
          set -o pipefail
          xcodebuild build \
            -project PassManager.xcodeproj \
            -scheme PassManager \
            -destination 'generic/platform=iOS Simulator' \
            2>&1 | tee xcodebuild.log | tail -80
      # A screen recording of the tour is the only way to actually WATCH this app
      # without a Mac: the iOS simulator is not an emulator that can be ported, it
      # runs real arm64 macOS frameworks, so it exists on macOS and nowhere else.
      # Stills cannot show transitions, the reveal animation, or the appearance
      # switch halfway through the run; the video can. Never fail the job over it.
      - name: Boot the simulator and start recording
        if: steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -x
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true
          mkdir -p "$GITHUB_WORKSPACE/video"
          nohup xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo \
            --codec h264 --force "$GITHUB_WORKSPACE/video/tour.mp4" \
            > "$GITHUB_WORKSPACE/video/record.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/video/record.pid"

      - name: Run app tests on simulator
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project PassManager.xcodeproj \
            -scheme PassManager \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodetest.log | tail -80

      # `simctl` finalises the MP4 container when it receives SIGINT and only then;
      # killing the job without this leaves a truncated file that no player opens.
      - name: Stop recording
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -x
          PID=$(cat "$GITHUB_WORKSPACE/video/record.pid" 2>/dev/null || true)
          if [ -n "$PID" ]; then
            kill -INT "$PID" || true
            for _ in $(seq 1 30); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
          fi
          ls -la "$GITHUB_WORKSPACE/video" || true
          cat "$GITHUB_WORKSPACE/video/record.log" || true

      - name: Upload tour recording
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-tour-video
          path: video/tour.mp4
          if-no-files-found: warn

      # The UI test attaches one screenshot per screen with lifetime .keepAlways, so they
      # survive a passing run and land in the result bundle. Never fail the job over this:
      # a missing screenshot is a documentation gap, not a broken build.
      - name: Export screenshots from the result bundle
        if: always() && steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        continue-on-error: true
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path "$GITHUB_WORKSPACE/screenshots" || \
          xcrun xcresulttool export --type directory \
            --path TestResults.xcresult \
            --output-path "$GITHUB_WORKSPACE/screenshots" || true
          find "$GITHUB_WORKSPACE/screenshots" -type f | head -40
          find "$GITHUB_WORKSPACE/screenshots" -name "*.png" | wc -l

      - name: Upload screenshots
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: warn

      # `always()`, not `success()`: the build produced a .app long before the test
      # step ran, so a failing test is exactly when you most want the bundle in
      # hand to poke at. Gating this on success() cost a whole run once already.
      - name: Export simulator .app artifact
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "PassManager.app" -path "*iphonesimulator*" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p out && cp -R "$APP_PATH" out/

      # A .app a browser-streaming service (Appetize and friends) can install into
      # a simulator — the only way to hand this app to someone who has no Mac and
      # let them actually touch it.
      #
      # `ditto`, not `zip` and not upload-artifact's own zipping: neither preserves
      # the executable bit or the symlinks inside a bundle, and a .app whose binary
      # is not +x will not install. Nesting a correct zip inside the artifact's zip
      # is what carries the permissions across.
      #
      # PlugIns holds the XCTest runner injected during the test run: dead weight
      # for a demo build, and it confuses installers that scan for extensions.
      - name: Package the simulator app for browser streaming
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -x
          rm -rf out/PassManager.app/PlugIns
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent out/PassManager.app dist/PassManager-simulator.zip
          ls -la dist

      - name: Upload streamable app bundle
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: dist/PassManager-simulator.zip
          if-no-files-found: warn

      - name: Upload logs and artifact
        if: always() && steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-build-output
          path: |
            ios/PassManager/xcodebuild.log
            ios/PassManager/xcodetest.log
            out/
