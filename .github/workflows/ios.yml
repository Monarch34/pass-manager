name: iOS

on:
  push:
    # `ios-ui` is a second working branch so the design pass and the signing/
    # Keychain work can each get their own CI feedback loop without queueing
    # behind one another. `concurrency` is keyed on the ref, so the two never
    # cancel each other's runs.
    branches: [ios-app, ios-ui]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than `brew install xcodegen`: XcodeGen 2.45.x started writing
  # pbxproj objectVersion 77, which the runner image's Xcode cannot open, and the
  # failure arrives as an unrelated-looking parse error. Pinning makes the generated
  # project format a decision instead of whatever Homebrew resolved that morning.
  XCODEGEN_VERSION: "2.44.1"

jobs:
  core-test:
    name: Core package tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Check for core package
        id: probe
        run: |
          if [ -f ios/PassVaultCore/Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/PassVaultCore not present yet — skipping."
          fi
      - name: Build and test PassVaultCore
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassVaultCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee core-test.log
      - name: Upload core test log
        if: always() && steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-test-log
          path: ios/PassVaultCore/core-test.log

  app-build:
    name: App build (simulator, ad-hoc signed)
    runs-on: macos-14
    needs: core-test
    steps:
      - uses: actions/checkout@v4
      - name: Check for app project
        id: probe
        run: |
          if [ -f ios/PassManager/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/PassManager/project.yml not present yet — skipping."
          fi
      - name: Select newest Xcode on the runner
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Available: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install pinned XcodeGen
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          BIN=$(find /tmp/xcodegen -type f -name xcodegen -perm +111 | head -1)
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version
      - name: Generate Xcode project
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        run: xcodegen generate
      # No device is named anywhere: selecting the newest Xcode also swaps the simulator
      # set it ships with, so a literal "iPhone 15" silently stops resolving and the
      # failure reads like a project error. Building needs no device at all; the test run
      # takes whatever iPhone the image actually has and addresses it by UDID.
      - name: Resolve a simulator for testing
        if: steps.probe.outputs.present == 'true'
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x.get('isAvailable') and 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # No CODE_SIGNING_ALLOWED override here, on purpose: a command-line setting
      # beats the project's, and the project now asks for ad-hoc signing so the
      # app carries an `application-identifier` and therefore has a Keychain at
      # all. Overriding it back to NO would silently take that away and the only
      # symptom would be a vault that cannot be created.
      - name: Build for simulator
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        run: |
          set -o pipefail
          xcodebuild build \
            -project PassManager.xcodeproj \
            -scheme PassManager \
            -destination 'generic/platform=iOS Simulator' \
            2>&1 | tee xcodebuild.log | tail -80
      - name: Run app tests on simulator
        if: steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project PassManager.xcodeproj \
            -scheme PassManager \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodetest.log | tail -80

      # The UI test attaches one screenshot per screen with lifetime .keepAlways, so they
      # survive a passing run and land in the result bundle. Never fail the job over this:
      # a missing screenshot is a documentation gap, not a broken build.
      - name: Export screenshots from the result bundle
        if: always() && steps.probe.outputs.present == 'true'
        working-directory: ios/PassManager
        continue-on-error: true
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path "$GITHUB_WORKSPACE/screenshots" || \
          xcrun xcresulttool export --type directory \
            --path TestResults.xcresult \
            --output-path "$GITHUB_WORKSPACE/screenshots" || true
          find "$GITHUB_WORKSPACE/screenshots" -type f | head -40
          find "$GITHUB_WORKSPACE/screenshots" -name "*.png" | wc -l

      - name: Upload screenshots
        if: always() && steps.probe.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Export simulator .app artifact
        if: success() && steps.probe.outputs.present == 'true'
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "PassManager.app" -path "*iphonesimulator*" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p out && cp -R "$APP_PATH" out/
      - name: Upload logs and artifact
        if: always() && steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-build-output
          path: |
            ios/PassManager/xcodebuild.log
            ios/PassManager/xcodetest.log
            out/
