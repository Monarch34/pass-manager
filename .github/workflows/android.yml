name: Android

# The phone app, its 372 JVM unit tests, and the 23 instrumented tests that had never
# been executed by any automation before this workflow existed.
#
# No `paths:` filter. The whole point of this file is that nothing merges without the
# suite having run, and a filter is a list of ways to be wrong about which change can
# break which test — `:app` already depends on `protocol/` through a composite build, so
# "only protocol changed" is not a reason to skip the app's tests.

on:
  push:
    branches: [main, release-hardening, android-hardening, android-site-icons]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches app/build.gradle.kts (VERSION_17 / JVM_17) and protocol/build.gradle.kts.
          java-version: '17'
          # Deliberately no `cache:` input — gradle/actions/setup-gradle owns the Gradle
          # User Home cache, and the two mechanisms are documented to interfere.

      - uses: gradle/actions/setup-gradle@v6

      # AGP checks `sdk.dir` in local.properties BEFORE ANDROID_HOME, and takes the first
      # hit. So a local.properties restored from a cache or baked into an image does not
      # lose to a correct ANDROID_HOME — it wins, and the build fails on a path from
      # somebody else's laptop. The file is gitignored and must not exist here.
      - name: Assert no local.properties shadows ANDROID_HOME
        run: |
          if [ -f local.properties ]; then
            echo "::error::local.properties exists and overrides ANDROID_HOME:"
            cat local.properties
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"

      # No keystore.properties either: the release-signing guard is bound to
      # `packageRelease`/`packageReleaseBundle` by exact task name and fires at execution
      # time, so nothing below is affected by its absence.
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Compiled, not run — the instrumented job below runs them. Kept separate so a
      # compile break in androidTest sources is reported here in two minutes rather than
      # after the emulator has booted.
      - name: Compile instrumented sources
        run: ./gradlew --no-daemon compileDebugAndroidTestKotlin

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      # `fixtures/` is a cross-platform artifact iOS pins the bytes of. CrossPlatformFixtureTest
      # only rewrites it under -Dpmvault.fixture.regenerate=true, so a diff here means either
      # that flag reached CI or something else is writing into the tree. Either way it is a
      # bug, and a silent one — the old test regenerated the fixture and reported green.
      - name: Fail if the build mutated tracked files
        run: |
          if ! git diff --quiet; then
            echo "::error::the build modified tracked files:"
            git --no-pager diff --stat
            exit 1
          fi

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  instrumented:
    name: Instrumented tests (API 35)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # GitHub's Linux runners expose /dev/kvm, but the device node is not group-writable
      # by default. Without this the emulator falls back to software rendering and an
      # Argon2 test at m=64MiB t=3 takes long enough to look like a hang.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # api-level 35 matches compileSdk/targetSdk. `arch` must be stated: the action
      # defaults to x86, which has no system image at this API level, and the failure
      # reads as an unrelated SDK error.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
