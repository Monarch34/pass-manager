name: PassManager

options:
  bundleIdPrefix: com.passmanager
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # SAFETY BELT — normally a no-op now. The workflow pins XCODEGEN_VERSION and
  # selects the runner's Xcode explicitly, so the generator and the toolchain
  # agree on a format and this should never trigger.
  #
  # Kept because the failure it prevents is silent and total: an unpinned
  # XcodeGen (Homebrew was shipping 2.45.4) writes pbxproj objectVersion 77, and
  # an Xcode predating that format refuses to open the project at all — "a future
  # Xcode project file format (77)" — before one line is compiled. `objectVersion`
  # below is the documented knob but 2.45.4 ignores it, so the postGenCommand is
  # what actually enforces the format. 56 is Xcode 14+ and covers everything used
  # here, local SPM packages included.
  #
  # If this project ever needs a genuinely newer pbxproj feature, delete both
  # lines rather than fighting them.
  objectVersion: 56
  postGenCommand: sed -i '' -e 's/objectVersion = [0-9][0-9]*;/objectVersion = 56;/' -e 's/compatibilityVersion = "[^"]*";/compatibilityVersion = "Xcode 14.0";/' PassManager.xcodeproj/project.pbxproj

packages:
  PassVaultCore:
    path: ../PassVaultCore

targets:

  PassManager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - package: PassVaultCore
        product: PassVaultCore
      - package: PassVaultCore
        product: PassVaultStorage
    # A real Info.plist rather than GENERATE_INFOPLIST_FILE, because the exported
    # type declaration below has no INFOPLIST_KEY_ equivalent. XcodeGen writes
    # this file during generation; it is not committed.
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: PassManager
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Declares `.pmvault` as a type this app OWNS — it defines the format
        # rather than merely consuming someone else's. Without this the system
        # would not associate the extension with the app, and the Files picker
        # would grey out every export the app itself produced.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.passmanager.pmvault
            UTTypeDescription: PassManager encrypted vault
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - pmvault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passmanager.ios
        PRODUCT_NAME: PassManager
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""

  PassManagerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: PassManager
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.passmanager.ios.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  PassManager:
    build:
      targets:
        PassManager: all
        PassManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PassManagerTests
