name: PassManager

options:
  bundleIdPrefix: com.passmanager
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # LOAD-BEARING. Do not delete without checking the workflow first.
  #
  # As of CI run 33019044683 the workflow still does a plain `brew install
  # xcodegen`, which installs 2.45.4, and the runner is Xcode 15.4. 2.45.4 writes
  # pbxproj objectVersion 77 (Xcode 16), and 15.4 refuses to open that at all —
  # "a future Xcode project file format (77)" — before a single line is compiled.
  # The postGenCommand below is the only thing currently preventing that.
  #
  # `objectVersion` is the documented knob for this, but 2.45.4 ignores it, so
  # the sed is what actually enforces the format. 56 is Xcode 14+ and covers
  # everything used here, local SPM packages included.
  #
  # A workflow change pinning XCODEGEN_VERSION is planned; once a run shows the
  # generator and the toolchain agreeing on a format, this becomes a genuine
  # no-op and can be dropped. Verify against a real run rather than this comment.
  objectVersion: 56
  postGenCommand: sed -i '' -e 's/objectVersion = [0-9][0-9]*;/objectVersion = 56;/' -e 's/compatibilityVersion = "[^"]*";/compatibilityVersion = "Xcode 14.0";/' PassManager.xcodeproj/project.pbxproj

packages:
  PassVaultCore:
    path: ../PassVaultCore

targets:

  PassManager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - package: PassVaultCore
        product: PassVaultCore
      - package: PassVaultCore
        product: PassVaultStorage
    # A real Info.plist rather than GENERATE_INFOPLIST_FILE, because the exported
    # type declaration below has no INFOPLIST_KEY_ equivalent. XcodeGen writes
    # this file during generation; it is not committed.
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: PassManager
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Declares `.pmvault` as a type this app OWNS — it defines the format
        # rather than merely consuming someone else's. Without this the system
        # would not associate the extension with the app, and the Files picker
        # would grey out every export the app itself produced.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.passmanager.pmvault
            UTTypeDescription: PassManager encrypted vault
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - pmvault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passmanager.ios
        PRODUCT_NAME: PassManager
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # AD-HOC SIGNED, DELIBERATELY — this is what gives the app a Keychain.
        #
        # `CODE_SIGNING_ALLOWED: NO` also skips ProcessProductPackaging, so the
        # entitlements never reach the binary and the app runs with no
        # `application-identifier`, hence no keychain access group, hence a
        # `SecItemAdd` that cannot succeed whatever protection class it asks for.
        # An app that cannot write to the Keychain cannot create a vault, so this
        # setting decided how much of the app CI could exercise.
        #
        # `-` is the ad-hoc identity: no certificate, no team, no provisioning
        # profile, and the simulator does not check any of the three. Signing is
        # not REQUIRED, so a machine without a keychain-unlocked identity still
        # builds; it is merely ALLOWED, which is all it takes for the entitlements
        # to be embedded. A device build needs real settings here.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: PassManager.entitlements

  PassManagerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: PassManager
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.passmanager.ios.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        # Stated rather than inferred: the Keychain suite is only a test of the
        # SHIPPING entitlement if it runs inside the app's process. Hosted by the
        # xctest runner instead, it would be exercising the runner's Keychain
        # access and would pass whatever the app itself can or cannot do.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PassManager.app/PassManager"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Drives the app on a simulator to capture the screenshot tour. Kept separate
  # from PassManagerTests because it needs a running app rather than a test host,
  # and because it is far slower than the logic suites.
  PassManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: PassManager
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.passmanager.ios.uitests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  PassManager:
    build:
      targets:
        PassManager: all
        PassManagerTests: [test]
        PassManagerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PassManagerTests
        - PassManagerUITests
