# One catalog for the whole build. There is exactly one Gradle build here and exactly one
# place a version is written down.
#
# The core four are not independently chosen — they are the intersection of three published
# compatibility tables, and moving any one of them moves the others:
#
#   Kotlin 2.4.10 supports  Gradle 7.6.3-9.5.0  and  AGP 8.5.2-9.1.0
#   AGP 9.1.1     requires  Gradle 9.3.1+
#   => Gradle 9.5.0 is the only point satisfying both ends.
#
# Newer things exist (Gradle 9.7.1, AGP 9.3.2) and are deliberately not used: they fall
# outside the Kotlin Multiplatform plugin's tested envelope, and "probably fine" is not a
# property worth having in the build of a password manager.

[versions]
kotlin = "2.4.10"
agp = "9.1.1"

# Android. compileSdk 37 is Android 17, which AGP 9.1.1 supports. minSdk 26 is the floor
# the crypto needs: AES-GCM through the platform provider and a usable Keystore.
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# One JDK for compiling and one bytecode level, both 17. Google's Android-KMP guidance
# suggests a 21 toolchain, and that is the eventual move, but 21 compiles to Java 21
# bytecode by default and then Android needs a jvmTarget override to be dexable. Two knobs
# that must agree is a way to be wrong; 17 is AGP's own minimum and default, is on both CI
# images and every development machine here, and needs no override at all.
jvmToolchain = "17"

# Provisions the toolchain JDK on a machine that does not already have it, so a fresh
# checkout builds without anyone editing JAVA_HOME.
foojay = "1.0.0"

# The vault body's encoding. Bundled with the Kotlin plugin (the plugin version IS the
# Kotlin version); only the runtime library is versioned separately.
kotlinxSerialization = "1.9.0"

[libraries]
# Dependencies arrive with the code that needs them, so this never lists something nothing
# imports.
#
# JSON rather than a hand-rolled binary body, and rather than CBOR. The body sits inside an
# authentication tag, so a parser is safe there; what matters is that the encoding is stable
# forever and identical on three platforms. kotlinx-serialization emits members in
# declaration order deterministically, which is exactly the property Foundation's
# `.sortedKeys` failed to provide when its collation changed between Xcode releases. CBOR
# would encode straight to bytes and avoid an intermediate string, but its kotlinx
# implementation is still marked experimental, and an on-disk format for a password manager
# is the wrong place to depend on output that may be allowed to change.
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
# The KMP-specific Android plugin. From AGP 9.0 the Kotlin Multiplatform plugin is no
# longer compatible with `com.android.library` in the same module, so a shared module uses
# this one and configures Android inside `kotlin { android { } }`.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# Versioned by `kotlin`, not independently: the compiler plugin and the compiler are one
# release, and a mismatch fails at compile time rather than at runtime.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
